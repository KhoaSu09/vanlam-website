<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quản lý sản phẩm | Vanlam technologies</title>
  <meta name="description" content="Quản lý sản phẩm của Vanlam technologies. Thêm, chỉnh sửa và xóa sản phẩm, kèm hình ảnh và giá." />
  <meta name="keywords" content="quản lý sản phẩm, sản phẩm, Vanlam technologies, đăng sản phẩm" />
  <meta property="og:title" content="Quản lý sản phẩm | Vanlam technologies" />
  <meta property="og:description" content="Trang quản lý sản phẩm cho cửa hàng của Vanlam technologies. Thêm sản phẩm, sửa sản phẩm, xóa sản phẩm và cập nhật thông tin." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://example.com/og-image.png" />
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --text:#111; --muted:#6b7280; --primary:#0f3c7d; --danger:#c92a2a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, system-ui, Arial; background:var(--bg); color:var(--text); }
    .page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; }

    .card { width:100%; max-width:520px; background:var(--card); border-radius:18px; padding:32px; box-shadow:0 18px 50px rgba(2,6,23,.08); }
    h1 { margin:0 0 16px; font-size:28px; text-align:center; }
    .hint { margin:0 0 24px; text-align:center; color:#c92a2a; font-weight:600; }

    .form-group { margin-bottom:18px; }
    .form-label { display:block; font-size:14px; margin-bottom:8px; color:var(--muted); }
    .form-control { width:100%; padding:12px 14px; border:1px solid #d2d6dc; border-radius:12px; font-size:15px; }
    .form-control:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(15,60,125,.12); }

    button { width:100%; padding:12px 14px; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-primary:hover { filter:brightness(1.06); }
    .btn-secondary { background:#e5e7eb; color:#111; }

    .footer { margin-top:24px; text-align:center; font-size:13px; color:var(--muted); }

    .hidden { display:none !important; }

    /* Management UI */
    .manager { display:flex; flex-direction:column; gap:16px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    .toolbar .btn { width:auto; }

    .products-list { display:grid; gap:12px; }
    .product-item { border:1px solid #e5e7eb; border-radius:12px; padding:14px 16px; background:#fff; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .product-meta { font-size:13px; color:var(--muted); margin-top:4px; }

    .product-actions { display:flex; gap:8px; }
    .btn-danger { background:var(--danger); color:#fff; }
    .btn-danger:hover { filter:brightness(1.08); }

    .modal { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.45); padding:16px; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease; }
    .modal.active { opacity:1; pointer-events:auto; }
    .modal-content { width:100%; max-width:520px; background:var(--card); border-radius:18px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.2); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .modal-title { margin:0; font-size:20px; }
    .modal-close { background:none; border:none; font-size:24px; cursor:pointer; color:var(--muted); }
    .modal-close:hover { color:var(--text); }
  </style>
</head>
<body>
  <div class="page">
    <div class="card" id="loginCard">
      <h1>Đăng nhập Admin</h1>
      <div id="loginHint" class="hint hidden"></div>
      <div class="form-group">
        <label class="form-label" for="passwordInput">Vui lòng nhập mật khẩu</label>
        <input id="passwordInput" class="form-control" type="password" placeholder="Nhập mật khẩu admin" autocomplete="current-password" />
      </div>
      <button id="loginBtn" class="btn btn-primary">Đăng nhập</button>
      <div class="footer">
        <a href="index.html">← Quay về trang chủ</a>
      </div>
    </div>

    <div class="card hidden" id="managerCard">
      <div class="manager">
        <div class="toolbar">
          <div>
            <h1 style="margin:0; font-size:22px;">Quản lý sản phẩm</h1>
            <div id="managerInfo" class="product-meta">Tải sản phẩm...</div>
          </div>
          <div class="product-actions">
            <button id="addProductBtn" class="btn btn-primary">Thêm sản phẩm</button>
            <button id="logoutBtn" class="btn btn-secondary">Đăng xuất</button>
          </div>
        </div>

        <div id="productsList" class="products-list"></div>
      </div>
    </div>
  </div>

  <div id="productModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Thêm / Sửa sản phẩm</h2>
        <button class="modal-close" aria-label="Đóng" onclick="closeModal()">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label" for="productName">Tên sản phẩm</label>
        <input id="productName" class="form-control" type="text" placeholder="Nhập tên sản phẩm" />
      </div>
      <div class="form-group">
        <label class="form-label" for="productDescription">Mô tả</label>
        <textarea id="productDescription" class="form-control" rows="5" placeholder="Nhập mô tả sản phẩm"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="productPrice">Giá (VNĐ)</label>
        <input id="productPrice" class="form-control" type="number" placeholder="Nhập giá sản phẩm" />
      </div>
      <div class="form-group">
        <label class="form-label" for="productImage">Hình ảnh (tùy chọn)</label>
        <input id="productImage" class="form-control" type="file" accept="image/*" />
        <div id="imagePreview" style="margin-top:8px;"></div>
      </div>
      <button id="saveProductBtn" class="btn btn-primary">Lưu</button>
    </div>
  </div>

  <footer style="position:fixed; bottom:12px; left:0; right:0; text-align:center; font-size:12px; color:var(--muted);">
    © 2025 Vanlam technologies. All rights reserved.
  </footer>

  <script>
    const PRODUCTS_KEY = 'vl_products_v1';
    const ADMIN_PASSWORD = 'admin123'; // Thay đổi mật khẩu ở đây

    const loginCard = document.getElementById('loginCard');
    const managerCard = document.getElementById('managerCard');
    const loginHint = document.getElementById('loginHint');

    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');

    const addProductBtn = document.getElementById('addProductBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const productsList = document.getElementById('productsList');
    const managerInfo = document.getElementById('managerInfo');

    const productModal = document.getElementById('productModal');
    const modalTitle = document.getElementById('modalTitle');
    const productName = document.getElementById('productName');
    const productDescription = document.getElementById('productDescription');
    const productPrice = document.getElementById('productPrice');
    const productImage = document.getElementById('productImage');
    const saveProductBtn = document.getElementById('saveProductBtn');

    let editingId = null;

    function loadProducts() {
      try { return JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]'); }
      catch (e) { return []; }
    }

    function saveProducts(products) {
      localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));
    }

    function formatPrice(price) {
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
    }

    function renderProducts() {
      const products = loadProducts().sort((a,b) => new Date(b.date) - new Date(a.date));
      managerInfo.textContent = `${products.length} sản phẩm`; 
      if (!products.length) {
        productsList.innerHTML = '<div style="padding:18px; border:1px dashed #cbd5e1; border-radius:12px; text-align:center; color:#6b7280;">Chưa có sản phẩm nào.</div>';
        updateSeoJsonLd([]);
        return;
      }

      productsList.innerHTML = products.map(p => {
        const preview = p.description.length > 100 ? p.description.substring(0, 100) + '…' : p.description;
        const imageHtml = p.image ? `<img src="${p.image}" style="max-width:100%; height:auto; margin-bottom:8px; border-radius:8px;" loading="lazy" />` : '';
        return `
          <div class="product-item" data-id="${p.id}">
            <div style="flex:1;">
              <strong>${escapeHtml(p.name)}</strong>
              <div class="product-meta">${formatPrice(p.price)}</div>
              ${imageHtml}
              <div style="margin-top:8px; color:#4b5563; font-size:14px; white-space:pre-wrap;">${escapeHtml(preview)}</div>
            </div>
            <div class="product-actions">
              <button class="btn btn-secondary" onclick="openEdit('${p.id}')">Sửa</button>
              <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">Xóa</button>
            </div>
          </div>
        `;
      }).join('');

      updateSeoJsonLd(products);
    }

    function updateSeoJsonLd(products) {
      const schema = {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Vanlam technologies - Sản phẩm",
        "url": window.location.href,
        "description": "Danh sách sản phẩm của Vanlam technologies.",
        "itemListElement": products.map((p, index) => ({
          "@type": "Product",
          "position": index + 1,
          "name": p.name,
          "description": p.description,
          "offers": {
            "@type": "Offer",
            "price": p.price,
            "priceCurrency": "VND"
          },
          "url": `${window.location.origin}${window.location.pathname}#${p.id}`
        }))
      };

      let schemaEl = document.getElementById('ldJson');
      if (!schemaEl) {
        schemaEl = document.createElement('script');
        schemaEl.id = 'ldJson';
        schemaEl.type = 'application/ld+json';
        document.head.appendChild(schemaEl);
      }
      schemaEl.textContent = JSON.stringify(schema, null, 2);
    }

    function escapeHtml(s) {
      return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function showManager() {
      loginCard.classList.add('hidden');
      managerCard.classList.remove('hidden');
      renderProducts();
    }

    function showLogin(message) {
      managerCard.classList.add('hidden');
      loginCard.classList.remove('hidden');
      if (message) {
        loginHint.textContent = message;
        loginHint.classList.remove('hidden');
      } else {
        loginHint.classList.add('hidden');
      }
      passwordInput.value = '';
      passwordInput.focus();
    }

    function checkAuth() {
      return sessionStorage.getItem('vl_admin_authed') === '1';
    }

    function setAuth(value) {
      if (value) sessionStorage.setItem('vl_admin_authed', '1');
      else sessionStorage.removeItem('vl_admin_authed');
    }

    function openModal(product = null) {
      productModal.classList.add('active');
      if (product) {
        editingId = product.id;
        modalTitle.textContent = 'Sửa sản phẩm';
        productName.value = product.name;
        productDescription.value = product.description;
        productPrice.value = product.price;
        document.getElementById('imagePreview').innerHTML = product.image ? `<img src="${product.image}" style="max-width:100%; height:auto; border-radius:8px;" loading="lazy" />` : '';
      } else {
        editingId = null;
        modalTitle.textContent = 'Thêm sản phẩm';
        productName.value = '';
        productDescription.value = '';
        productPrice.value = '';
        document.getElementById('imagePreview').innerHTML = '';
      }
      productImage.value = '';
      productName.focus();
    }

    function closeModal() {
      productModal.classList.remove('active');
    }

    async function saveProduct() {
      const name = productName.value.trim();
      const description = productDescription.value.trim();
      const price = parseFloat(productPrice.value);

      if (!name || !description || isNaN(price) || price < 0) {
        alert('Vui lòng điền đầy đủ tên, mô tả và giá hợp lệ.');
        return;
      }

      let image = null;
      if (productImage.files[0]) {
        image = await readFileAsDataURL(productImage.files[0]);
      }

      const products = loadProducts();
      if (editingId) {
        const idx = products.findIndex(p => p.id === editingId);
        if (idx !== -1) {
          products[idx] = { ...products[idx], name, description, price, image: image || products[idx].image };
        }
      } else {
        products.push({ id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(), name, description, price, date: new Date().toISOString(), image });
      }

      saveProducts(products);
      closeModal();
      renderProducts();
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function openEdit(id) {
      const products = loadProducts();
      const product = products.find(p => p.id === id);
      if (!product) return;
      openModal(product);
    }

    function deleteProduct(id) {
      if (!confirm('Xóa sản phẩm này?')) return;
      const products = loadProducts().filter(p => p.id !== id);
      saveProducts(products);
      renderProducts();
    }

    loginBtn.addEventListener('click', () => {
      const value = passwordInput.value.trim();
      if (value === ADMIN_PASSWORD) {
        setAuth(true);
        showManager();
      } else {
        showLogin('Mật khẩu không đúng, vui lòng thử lại.');
      }
    });

    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    addProductBtn.addEventListener('click', () => openModal());
    logoutBtn.addEventListener('click', () => {
      setAuth(false);
      showLogin();
    });

    saveProductBtn.addEventListener('click', async () => {
      await saveProduct();
    });

    productModal.addEventListener('click', (e) => {
      if (e.target === productModal) closeModal();
    });

    // Init
    if (checkAuth()) showManager();
    else showLogin();
  </script>
</body>
</html>
