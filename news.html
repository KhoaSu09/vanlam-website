<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tin tức | Vanlam Technologies</title>
  <meta name="description" content="Tin tức và bài viết mới nhất từ Vanlam Technologies. Cập nhật thông tin về CNTT, chuyển đổi số và giải pháp công nghệ." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Global Styles -->
  <link rel="stylesheet" href="index.css">
  
  <style>
    .page-header {
      background: var(--primary);
      color: white;
      padding: 80px 0;
      text-align: center;
    }
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      padding: 60px 0;
    }
    .post-card {
      padding: 0;
      overflow: hidden;
      cursor: pointer;
    }
    .post-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .post-card:hover .post-img {
      transform: scale(1.05);
    }
    .post-content {
      padding: 1.5rem;
    }
    .post-date {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    
    /* Modal Modernization */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      color: var(--text);
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: var(--radius);
      padding: 2rem;
      position: relative;
      box-shadow: var(--shadow-lg);
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--border);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal-body img {
      width: 100%;
      border-radius: var(--radius);
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>

  <!-- Header is injected by ui.js -->

  <main>
    <section class="page-header reveal">
      <div class="container">
        <h1 style="color: white; margin-bottom: 0.5rem;">Tin tức & Sự kiện</h1>
        <p style="color: #94a3b8;">Cập nhật những xu hướng công nghệ và hoạt động mới nhất từ Vanlam Technologies</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div id="postsList" class="posts-grid">
          <!-- Dynamically populated by JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Detail -->
  <div id="postModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalDate" class="post-date"></div>
      <h2 id="modalTitle" style="margin-bottom: 1.5rem;"></h2>
      <div id="modalBody" class="modal-body" style="line-height: 1.8;">
        <!-- Content will be injected here -->
      </div>
    </div>
  </div>

  <!-- Footer is injected by ui.js -->

  <script src="auth.js"></script>
  <script src="ui.js"></script>

  <script>
    const POSTS_KEY = 'vl_posts_v1';

    function loadPosts() {
      try { return JSON.parse(localStorage.getItem(POSTS_KEY) || '[]'); } catch (e) { return []; }
    }

    function closeModal() {
      document.getElementById('postModal').classList.remove('active');
    }

    function openModalById(postId) {
      const posts = loadPosts();
      const post = posts.find(p => p.id === postId);
      if (!post) return;

      document.getElementById('modalTitle').textContent = post.title;
      document.getElementById('modalDate').textContent = new Date(post.date).toLocaleDateString('vi-VN', { 
        year: 'numeric', month: 'long', day: 'numeric' 
      });
      
      let contentHtml = post.content;
      if (post.image) {
        contentHtml = `<img src="${post.image}" alt="${post.title}">` + contentHtml;
      }
      
      document.getElementById('modalBody').innerHTML = contentHtml;
      document.getElementById('postModal').classList.add('active');
    }

    function renderPosts() {
      const container = document.getElementById('postsList');
      if (!container) return;
      const posts = loadPosts();
      
      if (!posts.length) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px 0;">Chưa có bài viết nào.</div>';
        return;
      }
      
      container.innerHTML = posts.map((p, index) => {
        const delay = (index % 3) * 0.1;
        return `
        <article class="card post-card reveal" style="transition-delay: ${delay}s" onclick="openModalById('${p.id}')">
          ${p.image ? `<img src="${p.image}" class="post-img" alt="${p.title}">` : ''}
          <div class="post-content">
            <div class="post-date">${new Date(p.date).toLocaleDateString('vi-VN')}</div>
            <h3 style="margin-bottom: 0.5rem; font-size: 1.25rem;">${p.title}</h3>
            <p style="font-size: 0.9rem; -webkit-line-clamp: 3; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;">
              ${p.content}
            </p>
          </div>
        </article>
      `;
      }).join('');
      
      // Re-init reveal animations for dynamic content
      if (window.initScrollReveal) window.initScrollReveal();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPosts();
      
      // Close modal on outside click
      const modal = document.getElementById('postModal');
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
    });
  </script>
</body>
</html>
