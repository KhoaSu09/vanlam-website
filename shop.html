<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sản phẩm | Vanlam technologies</title>
  <meta name="description" content="Danh sách sản phẩm của Vanlam technologies. Khám phá các sản phẩm công nghệ và giải pháp số hóa." />
  <meta name="keywords" content="sản phẩm, shop, Vanlam technologies, công nghệ" />
  <meta property="og:title" content="Sản phẩm | Vanlam technologies" />
  <meta property="og:description" content="Mua sắm sản phẩm công nghệ từ Vanlam technologies. Các giải pháp số hóa và thiết bị hiện đại." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://example.com/og-image-shop.png" />
  <style>
    body { font-family: Inter, system-ui, Arial; margin:0; color:#111; background:#f8fafc }
    .container { max-width:1200px; margin:32px auto; padding:0 20px }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px }
    h1 { margin:0 }
    nav { display:flex; gap:16px }
    a { color:#0f3c7d; text-decoration:none }
    a:hover { text-decoration:underline }

    /* Products Grid */
    .products-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; margin-top:24px }
    .product-card { background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 4px 14px rgba(2,6,23,.04); transition:transform .2s, box-shadow .2s; cursor:pointer }
    .product-card:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(2,6,23,.08) }
    .product-header { padding:20px }
    .product-title { font-size:18px; font-weight:600; margin:0 0 8px; color:#0f3c7d }
    .product-price { font-size:16px; font-weight:700; color:#0f3c7d; margin-bottom:12px }
    .product-description { color:#4b5563; font-size:14px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; line-clamp:3; }
    .product-image { width:100%; height:200px; object-fit:cover; display:block }

    .empty-state { text-align:center; color:#6b7280; padding:60px 20px }
    .empty-state p { margin:0 }

    footer { background:#f3f4f6; padding:20px 0; margin-top:40px; text-align:center; font-size:13px; color:#6b7280 }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sản phẩm</h1>
      <nav>
        <a href="index.html">Trang chủ</a>
        <a href="products.html">Quản lý</a>
      </nav>
    </header>

    <div id="productsList" class="products-grid"></div>
  </div>

  <footer>
    © 2025 Vanlam technologies. All rights reserved.
  </footer>

  <script>
    const PRODUCTS_KEY = 'vl_products_v1';

    function loadProducts(){
      try{ return JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]') }catch(e){ return [] }
    }

    function escapeHtml(s){
      return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatPrice(price) {
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
    }

    function getPreview(description, length=150){
      return description.substring(0, length) + (description.length > length ? '...' : '');
    }

    function renderProducts(){
      const container = document.getElementById('productsList');
      const products = loadProducts();
      
      if(!products.length){
        container.innerHTML = '<div class="empty-state"><p>Chưa có sản phẩm nào</p></div>';
        updateSeoJsonLd([]);
        return;
      }
      
      container.innerHTML = products.map(p => {
        const imageHtml = p.image ? `<img class="product-image" src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy" />` : '';
        return `
        <article class="product-card">
          ${imageHtml}
          <div class="product-header">
            <h2 class="product-title">${escapeHtml(p.name)}</h2>
            <div class="product-price">${formatPrice(p.price)}</div>
            <p class="product-description">${escapeHtml(getPreview(p.description))}</p>
          </div>
        </article>
      `;
      }).join('');

      updateSeoJsonLd(products);
    }

    function updateSeoJsonLd(products) {
      const schema = {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Sản phẩm - Vanlam technologies",
        "url": window.location.href,
        "description": "Danh sách sản phẩm công nghệ từ Vanlam technologies.",
        "itemListElement": products.map((p, index) => ({
          "@type": "Product",
          "position": index + 1,
          "name": p.name,
          "description": p.description,
          "image": p.image,
          "offers": {
            "@type": "Offer",
            "price": p.price,
            "priceCurrency": "VND"
          },
          "url": `${window.location.origin}${window.location.pathname}#${p.id}`
        }))
      };

      let schemaEl = document.getElementById('ldJson');
      if (!schemaEl) {
        schemaEl = document.createElement('script');
        schemaEl.id = 'ldJson';
        schemaEl.type = 'application/ld+json';
        document.head.appendChild(schemaEl);
      }
      schemaEl.textContent = JSON.stringify(schema, null, 2);

      // Add hidden content for SEO
      const seoDiv = document.getElementById('seoContent');
      if (!seoDiv) {
        const newSeoDiv = document.createElement('div');
        newSeoDiv.id = 'seoContent';
        newSeoDiv.style.display = 'none';
        document.body.appendChild(newSeoDiv);
      }
      document.getElementById('seoContent').innerHTML = products.map(p => `
        <article>
          <h2>${escapeHtml(p.name)}</h2>
          <p>Giá: ${formatPrice(p.price)}</p>
          <p>${escapeHtml(p.description)}</p>
        </article>
      `).join('');
    }

    renderProducts();
  </script>
</body>
</html>
