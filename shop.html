<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sản phẩm | Vanlam technologies</title>
  <meta name="description" content="Danh sách sản phẩm của Vanlam technologies. Khám phá các sản phẩm công nghệ và giải pháp số hóa." />
  <meta name="keywords" content="sản phẩm, shop, Vanlam technologies, công nghệ" />
  <meta property="og:title" content="Sản phẩm | Vanlam technologies" />
  <meta property="og:description" content="Mua sắm sản phẩm công nghệ từ Vanlam technologies. Các giải pháp số hóa và thiết bị hiện đại." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://example.com/og-image-shop.png" />
  <style>
    body { font-family: Inter, system-ui, Arial; margin:0; color:#111; background:#f8fafc }
    .container { max-width:1200px; margin:32px auto; padding:0 20px }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px }
    h1 { margin:0 }
    nav { display:flex; gap:16px }
    a { color:#0f3c7d; text-decoration:none }
    a:hover { text-decoration:underline }
    a.active { font-weight:600; }

    /* Products Grid */
    .products-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; margin-top:24px }
    .product-card { background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 4px 14px rgba(2,6,23,.04); transition:transform .2s, box-shadow .2s; cursor:pointer }
    .product-card:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(2,6,23,.08) }
    .product-header { padding:20px }
    .product-title { font-size:18px; font-weight:600; margin:0 0 8px; color:#0f3c7d }
    .product-price { font-size:16px; font-weight:700; color:#0f3c7d; margin-bottom:12px }
    .product-description { color:#4b5563; font-size:14px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; line-clamp:3; }
    .product-image { width:100%; height:200px; object-fit:cover; display:block }
    .add-to-cart { display:block; margin-top:12px; padding:8px 12px; background:#0f3c7d; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; text-align:center; }
    .add-to-cart:hover { background:#0d2a5c; }

    .cart-icon { position:fixed; top:20px; right:20px; background:#0f3c7d; color:#fff; border-radius:50%; width:50px; height:50px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:20px; z-index:1000; }
    .cart-count { position:absolute; top:-5px; right:-5px; background:#c92a2a; color:#fff; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:12px; }

    .cart-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center }
    .cart-modal.active { display:flex }
    .cart-content { background:#fff; border-radius:12px; padding:20px; max-width:500px; max-height:80vh; overflow-y:auto; }
    .cart-item { display:flex; align-items:center; gap:12px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid #e5e7eb; }
    .cart-item img { width:60px; height:60px; object-fit:cover; border-radius:6px; }
    .cart-item-details { flex:1; }
    .cart-item-title { font-weight:600; margin:0; }
    .cart-item-price { color:#0f3c7d; font-weight:600; }
    .remove-item { background:#c92a2a; color:#fff; border:none; border-radius:4px; padding:4px 8px; cursor:pointer; }
    .cart-total { font-size:18px; font-weight:700; text-align:right; margin:20px 0; }
    .checkout-btn { width:100%; padding:12px; background:#0f3c7d; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
    .checkout-btn:hover { background:#0d2a5c; }

    .empty-state { text-align:center; color:#6b7280; padding:60px 20px }
    .empty-state p { margin:0 }

    footer { background:#f3f4f6; padding:20px 0; margin-top:40px; text-align:center; font-size:13px; color:#6b7280 }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sản phẩm</h1>
      <nav>
        <a href="index.html">Trang chủ</a>
        <a href="services.html">Dịch vụ</a>
        <a href="about.html">Giới thiệu</a>
        <a href="contact.html">Liên hệ</a>
        <a href="news.html">Tin tức</a>
        <a href="shop.html" class="active">Sản phẩm</a>
        <a href="products.html">Quản lý</a>
      </nav>
    </header>

    <div id="productsList" class="products-grid"></div>
  </div>

  <!-- Cart Icon -->
  <div class="cart-icon" onclick="openCart()">
    🛒
    <div class="cart-count" id="cartCount">0</div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="cart-modal">
    <div class="cart-content">
      <h2>Giỏ hàng</h2>
      <div id="cartItems"></div>
      <div class="cart-total" id="cartTotal">Tổng: 0 VNĐ</div>
      <button class="checkout-btn" onclick="checkout()">Thanh toán</button>
      <button onclick="closeCart()" style="margin-top:10px; width:100%; padding:8px; background:#e5e7eb; color:#111; border:none; border-radius:8px; cursor:pointer;">Đóng</button>
    </div>
  </div>

  <footer>
    © 2025 Vanlam technologies. All rights reserved.
  </footer>

  <script>
    const PRODUCTS_KEY = 'vl_products_v1';

    function loadProducts(){
      try{ return JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]') }catch(e){ return [] }
    }

    function escapeHtml(s){
      return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatPrice(price) {
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
    }

    function getPreview(description, length=150){
      return description.substring(0, length) + (description.length > length ? '...' : '');
    }

    function renderProducts(){
      const container = document.getElementById('productsList');
      const products = loadProducts();
      
      if(!products.length){
        container.innerHTML = '<div class="empty-state"><p>Chưa có sản phẩm nào</p></div>';
        updateSeoJsonLd([]);
        return;
      }
      
      container.innerHTML = products.map(p => {
        const imageHtml = p.image ? `<img class="product-image" src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy" />` : '';
        return `
        <article class="product-card">
          ${imageHtml}
          <div class="product-header">
            <h2 class="product-title">${escapeHtml(p.name)}</h2>
            <div class="product-price">${formatPrice(p.price)}</div>
            <p class="product-description">${escapeHtml(getPreview(p.description))}</p>
            <button class="add-to-cart" onclick="addToCart('${p.id}', '${escapeHtml(p.name)}', ${p.price}, '${p.image || ''}')">Thêm vào giỏ</button>
          </div>
        </article>
      `;
      }).join('');

      updateSeoJsonLd(products);
    }

    function updateSeoJsonLd(products) {
      const schema = {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Sản phẩm - Vanlam technologies",
        "url": window.location.href,
        "description": "Danh sách sản phẩm công nghệ từ Vanlam technologies.",
        "itemListElement": products.map((p, index) => ({
          "@type": "Product",
          "position": index + 1,
          "name": p.name,
          "description": p.description,
          "image": p.image,
          "offers": {
            "@type": "Offer",
            "price": p.price,
            "priceCurrency": "VND"
          },
          "url": `${window.location.origin}${window.location.pathname}#${p.id}`
        }))
      };

      let schemaEl = document.getElementById('ldJson');
      if (!schemaEl) {
        schemaEl = document.createElement('script');
        schemaEl.id = 'ldJson';
        schemaEl.type = 'application/ld+json';
        document.head.appendChild(schemaEl);
      }
      schemaEl.textContent = JSON.stringify(schema, null, 2);

      // Add hidden content for SEO
      const seoDiv = document.getElementById('seoContent');
      if (!seoDiv) {
        const newSeoDiv = document.createElement('div');
        newSeoDiv.id = 'seoContent';
        newSeoDiv.style.display = 'none';
        document.body.appendChild(newSeoDiv);
      }
      document.getElementById('seoContent').innerHTML = products.map(p => `
        <article>
          <h2>${escapeHtml(p.name)}</h2>
          <p>Giá: ${formatPrice(p.price)}</p>
          <p>${escapeHtml(p.description)}</p>
        </article>
      `).join('');
    }

    renderProducts();

    // Cart functions
    const CART_KEY = 'vl_cart';

    function getCart() {
      try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch(e) { return []; }
    }

    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
      updateCartCount();
    }

    function addToCart(id, name, price, image) {
      const cart = getCart();
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ id, name, price, image, quantity: 1 });
      }
      saveCart(cart);
      alert('Đã thêm vào giỏ hàng!');
    }

    function removeFromCart(id) {
      const cart = getCart().filter(item => item.id !== id);
      saveCart(cart);
      renderCart();
    }

    function updateCartCount() {
      const cart = getCart();
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cartCount').textContent = count;
    }

    function renderCart() {
      const cart = getCart();
      const cartItems = document.getElementById('cartItems');
      const cartTotal = document.getElementById('cartTotal');

      if (!cart.length) {
        cartItems.innerHTML = '<p>Giỏ hàng trống</p>';
        cartTotal.textContent = 'Tổng: 0 VNĐ';
        return;
      }

      cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">
          ${item.image ? `<img src="${item.image}" alt="${escapeHtml(item.name)}" />` : '<div style="width:60px; height:60px; background:#e5e7eb; border-radius:6px;"></div>'}
          <div class="cart-item-details">
            <h4 class="cart-item-title">${escapeHtml(item.name)}</h4>
            <div class="cart-item-price">${formatPrice(item.price)} x ${item.quantity}</div>
          </div>
          <button class="remove-item" onclick="removeFromCart('${item.id}')">Xóa</button>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      cartTotal.textContent = `Tổng: ${formatPrice(total)}`;
    }

    function openCart() {
      renderCart();
      document.getElementById('cartModal').classList.add('active');
    }

    function closeCart() {
      document.getElementById('cartModal').classList.remove('active');
    }

    function checkout() {
      alert('Tính năng thanh toán sẽ được phát triển sau. Liên hệ: khoasu.tech020@gmail.com');
    }

    // Init cart count
    updateCartCount();
  </script>
</body>
</html>
