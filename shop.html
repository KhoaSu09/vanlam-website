<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sản phẩm | Vanlam technologies</title>
  <meta name="description" content="Danh sách sản phẩm của Vanlam technologies. Khám phá các sản phẩm công nghệ và giải pháp số hóa." />
  <meta name="keywords" content="sản phẩm, shop, Vanlam technologies, công nghệ" />
  <meta property="og:title" content="Sản phẩm | Vanlam technologies" />
  <meta property="og:description" content="Mua sắm sản phẩm công nghệ từ Vanlam technologies. Các giải pháp số hóa và thiết bị hiện đại." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://example.com/og-image-shop.png" />
  <style>
    body { font-family: Inter, system-ui, Arial; margin:0; color:#111; background:#f8fafc }
    .container { max-width:1200px; margin:32px auto; padding:0 20px }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px }
    h1 { margin:0 }
    nav { display:flex; gap:16px }
    a { color:#0f3c7d; text-decoration:none }
    a:hover { text-decoration:underline }
    a.active { font-weight:600; }

    /* Products Grid */
    .products-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; margin-top:24px }
    .product-card { background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 4px 14px rgba(2,6,23,.04); transition:transform .2s, box-shadow .2s; cursor:pointer }
    .product-card:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(2,6,23,.08) }
    .product-header { padding:20px }
    .product-title { font-size:18px; font-weight:600; margin:0 0 8px; color:#0f3c7d }
    .product-price { font-size:16px; font-weight:700; color:#0f3c7d; margin-bottom:12px }
    .product-description { color:#4b5563; font-size:14px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; line-clamp:3; }
    .product-image { width:100%; height:200px; object-fit:cover; display:block }
    .add-to-cart { display:block; margin-top:12px; padding:8px 12px; background:#0f3c7d; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; text-align:center; }
    .add-to-cart:hover { background:#0d2a5c; }

    .product-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center }
    .product-modal.active { display:flex }
    .product-modal-content { background:#fff; border-radius:12px; padding:20px; max-width:600px; max-height:80vh; overflow-y:auto; }
    .product-modal-image { width:100%; max-height:300px; object-fit:cover; border-radius:8px; margin-bottom:16px; }
    .product-modal-title { font-size:24px; font-weight:700; color:#0f3c7d; margin:0 0 8px; }
    .product-modal-price { font-size:20px; font-weight:700; color:#0f3c7d; margin-bottom:16px; }
    .product-modal-description { color:#4b5563; line-height:1.6; margin-bottom:20px; }
    .product-modal-actions { display:flex; gap:12px; }
    .product-modal-actions button { flex:1; padding:12px; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
    .add-to-cart-modal { background:#0f3c7d; color:#fff; }
    .add-to-cart-modal:hover { background:#0d2a5c; }
    .close-modal { background:#e5e7eb; color:#111; }
    .close-modal:hover { background:#d1d5db; }

    .cart-icon { position:fixed; top:20px; right:20px; background:#0f3c7d; color:#fff; border-radius:50%; width:50px; height:50px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:20px; z-index:1000; }
    .cart-count { position:absolute; top:-5px; right:-5px; background:#c92a2a; color:#fff; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:12px; }

    .cart-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center }
    .cart-modal.active { display:flex }
    .cart-content { background:#fff; border-radius:12px; padding:20px; max-width:500px; max-height:80vh; overflow-y:auto; }
    .cart-item { display:flex; align-items:center; gap:12px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid #e5e7eb; }
    .cart-item img { width:60px; height:60px; object-fit:cover; border-radius:6px; }
    .cart-item-details { flex:1; }
    .cart-item-title { font-weight:600; margin:0; }
    .cart-item-price { color:#0f3c7d; font-weight:600; }
    .remove-item { background:#c92a2a; color:#fff; border:none; border-radius:4px; padding:4px 8px; cursor:pointer; }
    .cart-total { font-size:18px; font-weight:700; text-align:right; margin:20px 0; }
    .checkout-btn { width:100%; padding:12px; background:#0f3c7d; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
    .checkout-btn:hover { background:#0d2a5c; }

    .empty-state { text-align:center; color:#6b7280; padding:60px 20px }
    .empty-state p { margin:0 }

    footer { background:#f3f4f6; padding:20px 0; margin-top:40px; text-align:center; font-size:13px; color:#6b7280 }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sản phẩm</h1>
      <nav>
        <a href="index.html">Trang chủ</a>
        <a href="services.html">Dịch vụ</a>
        <a href="about.html">Giới thiệu</a>
        <a href="contact.html">Liên hệ</a>
        <a href="news.html">Tin tức</a>
        <a href="shop.html" class="active">Sản phẩm</a>
        <a href="products.html">Quản lý</a>
      </nav>
    </header>

    <div id="productsList" class="products-grid"></div>
  </div>

  <!-- Cart Icon -->
  <div class="cart-icon" onclick="openCart()">
    🛒
    <div class="cart-count" id="cartCount">0</div>
  </div>

  <!-- Product Detail Modal -->
  <div id="productModal" class="product-modal">
    <div class="product-modal-content">
      <img id="productModalImage" class="product-modal-image" src="" alt="" />
      <h2 id="productModalTitle" class="product-modal-title"></h2>
      <div id="productModalPrice" class="product-modal-price"></div>
      <p id="productModalDescription" class="product-modal-description"></p>
      <div class="product-modal-actions">
        <button class="add-to-cart-modal" onclick="addToCartFromModal()">Thêm vào giỏ</button>
        <button class="close-modal" onclick="closeProductModal()">Đóng</button>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="cart-modal">
    <div class="cart-content">
      <h3>Giỏ hàng</h3>
      <div id="cartItems"></div>
      <div id="cartTotal" class="cart-total">Tổng: 0 VNĐ</div>

      <div id="checkoutSection" style="margin-top:16px;">
        <button class="checkout-btn" onclick="showCheckoutForm()">Thanh toán</button>
      </div>

      <div id="checkoutForm" style="display:none; margin-top:16px; border-top:1px solid #e5e7eb; padding-top:16px;">
        <h4>Thông tin thanh toán</h4>
        <div style="margin-bottom:10px;"><input id="customerName" type="text" placeholder="Họ và tên" style="width:100%;padding:8px;" /></div>
        <div style="margin-bottom:10px;"><input id="customerPhone" type="tel" placeholder="Số điện thoại" style="width:100%;padding:8px;" /></div>
        <div style="margin-bottom:10px;"><input id="customerEmail" type="email" placeholder="Email" style="width:100%;padding:8px;" /></div>
        <div style="margin-bottom:10px;"><textarea id="customerAddress" placeholder="Địa chỉ giao hàng" style="width:100%;padding:8px;height:80px;"></textarea></div>
        <button class="checkout-btn" onclick="processCheckout()">Xác nhận đặt hàng</button>
        <button class="close-modal" style="margin-top:8px;" onclick="hideCheckoutForm()">Hủy</button>
      </div>

      <button class="close-modal" style="margin-top:12px;" onclick="closeCart()">Đóng</button>
    </div>
  </div>

  <footer>
    © 2025 Vanlam technologies. All rights reserved.
  </footer>

  <script>
    const PRODUCTS_KEY = 'vl_products_v1';

    function loadProducts(){
      try{ return JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]') }catch(e){ return [] }
    }

    function escapeHtml(s){
      return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatPrice(price) {
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
    }

    function getPreview(description, length=150){
      return description.substring(0, length) + (description.length > length ? '...' : '');
    }

    function renderProducts(){
      const container = document.getElementById('productsList');
      const products = loadProducts();
      
      if(!products.length){
        container.innerHTML = '<div class="empty-state"><p>Chưa có sản phẩm nào</p></div>';
        updateSeoJsonLd([]);
        return;
      }
      
      container.innerHTML = products.map(p => {
        const imageHtml = p.image ? `<img class="product-image" src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy" />` : '';
        return `
        <article class="product-card" data-id="${p.id}" data-name="${encodeURIComponent(p.name)}" data-price="${p.price}" data-image="${encodeURIComponent(p.image || '')}" data-description="${encodeURIComponent(p.description)}">
          ${imageHtml}
          <div class="product-header">
            <h2 class="product-title">${escapeHtml(p.name)}</h2>
            <div class="product-price">${formatPrice(p.price)}</div>
            <p class="product-description">${escapeHtml(getPreview(p.description))}</p>
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="add-to-cart add-direct-cart">Thêm vào giỏ</button>
              <button class="add-to-cart" style="background:#f3f4f6; color:#0f3c7d;">Xem chi tiết</button>
            </div>
          </div>
        </article>
      `;
      }).join('');

      updateSeoJsonLd(products);
    }

    function updateSeoJsonLd(products) {
      const schema = {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Sản phẩm - Vanlam technologies",
        "url": window.location.href,
        "description": "Danh sách sản phẩm công nghệ từ Vanlam technologies.",
        "itemListElement": products.map((p, index) => ({
          "@type": "Product",
          "position": index + 1,
          "name": p.name,
          "description": p.description,
          "image": p.image,
          "offers": {
            "@type": "Offer",
            "price": p.price,
            "priceCurrency": "VND"
          },
          "url": `${window.location.origin}${window.location.pathname}#${p.id}`
        }))
      };

      let schemaEl = document.getElementById('ldJson');
      if (!schemaEl) {
        schemaEl = document.createElement('script');
        schemaEl.id = 'ldJson';
        schemaEl.type = 'application/ld+json';
        document.head.appendChild(schemaEl);
      }
      schemaEl.textContent = JSON.stringify(schema, null, 2);

      // Add hidden content for SEO
      const seoDiv = document.getElementById('seoContent');
      if (!seoDiv) {
        const newSeoDiv = document.createElement('div');
        newSeoDiv.id = 'seoContent';
        newSeoDiv.style.display = 'none';
        document.body.appendChild(newSeoDiv);
      }
      document.getElementById('seoContent').innerHTML = products.map(p => `
        <article>
          <h2>${escapeHtml(p.name)}</h2>
          <p>Giá: ${formatPrice(p.price)}</p>
          <p>${escapeHtml(p.description)}</p>
        </article>
      `).join('');
    }

    renderProducts();

    // Add event listeners for product actions
    document.addEventListener('click', (e) => {
      const directButton = e.target.closest('.add-direct-cart');
      if (directButton) {
        e.stopPropagation();
        const card = directButton.closest('.product-card');
        if (!card) return;

        const id = card.dataset.id;
        const name = decodeURIComponent(card.dataset.name);
        const price = parseFloat(card.dataset.price);
        const image = decodeURIComponent(card.dataset.image);
        addToCart(id, name, price, image, 1);
        return;
      }

      const card = e.target.closest('.product-card');
      if (card) {
        const id = card.dataset.id;
        const name = decodeURIComponent(card.dataset.name);
        const price = parseFloat(card.dataset.price);
        const image = decodeURIComponent(card.dataset.image);
        const description = decodeURIComponent(card.dataset.description || '');
        openProductModal(id, name, price, image, description);
      }
    });

    // Cart functions
    const CART_KEY = 'vl_cart';
    let currentProduct = null;

    function getCart() {
      try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch(e) { return []; }
    }

    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
      updateCartCount();
    }

    function addToCart(id, name, price, image, quantity = 1) {
      console.log('Adding to cart:', id, name, price, image, quantity);
      const cart = getCart();
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.quantity += quantity;
      } else {
        cart.push({ id, name, price, image, quantity });
      }
      saveCart(cart);
      alert('Đã thêm vào giỏ hàng!');
    }

    function removeFromCart(id) {
      const cart = getCart().filter(item => item.id !== id);
      saveCart(cart);
      renderCart();
    }

    function updateCartCount() {
      const cart = getCart();
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      console.log('Cart count:', count);
      document.getElementById('cartCount').textContent = count;
    }

    function renderCart() {
      const cart = getCart();
      const cartItems = document.getElementById('cartItems');
      const cartTotal = document.getElementById('cartTotal');

      if (!cart.length) {
        cartItems.innerHTML = '<p>Giỏ hàng trống</p>';
        cartTotal.textContent = 'Tổng: 0 VNĐ';
        return;
      }

      cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">
          ${item.image ? `<img src="${item.image}" alt="${escapeHtml(item.name)}" />` : '<div style="width:60px; height:60px; background:#e5e7eb; border-radius:6px;"></div>'}
          <div class="cart-item-details">
            <h4 class="cart-item-title">${escapeHtml(item.name)}</h4>
            <div class="cart-item-price">${formatPrice(item.price)} x ${item.quantity}</div>
            <div style="display:flex; align-items:center; gap:8px; margin-top:8px;">
              <button style="padding:4px 8px; font-size:12px;" onclick="changeCartQuantity('${item.id}', -1)">-</button>
              <span>${item.quantity}</span>
              <button style="padding:4px 8px; font-size:12px;" onclick="changeCartQuantity('${item.id}', 1)">+</button>
            </div>
          </div>
          <button class="remove-item" onclick="removeFromCart('${item.id}')">Xóa</button>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      cartTotal.textContent = `Tổng: ${formatPrice(total)}`;
    }

    function changeCartQuantity(id, delta) {
      const cart = getCart();
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.quantity = Math.max(1, item.quantity + delta);
      saveCart(cart);
      renderCart();
    }

    function openCart() {
      renderCart();
      document.getElementById('cartModal').classList.add('active');
    }

    function closeCart() {
      document.getElementById('cartModal').classList.remove('active');
    }

    function showCheckoutForm() {
      document.getElementById('checkoutSection').style.display = 'none';
      document.getElementById('checkoutForm').style.display = 'block';
    }

    function hideCheckoutForm() {
      document.getElementById('checkoutForm').style.display = 'none';
      document.getElementById('checkoutSection').style.display = 'block';
    }

    function processCheckout() {
      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const email = document.getElementById('customerEmail').value.trim();
      const address = document.getElementById('customerAddress').value.trim();
      const cart = getCart();

      if (!cart.length) {
        alert('Giỏ hàng đang trống. Vui lòng thêm sản phẩm trước khi thanh toán.');
        return;
      }
      if (!name || !phone || !email || !address) {
        alert('Vui lòng điền đầy đủ thông tin thanh toán.');
        return;
      }

      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const order = {
        id: 'order_' + Date.now(),
        date: new Date().toISOString(),
        customer: { name, phone, email, address },
        items: cart,
        total
      };

      // tạm lưu đơn hàng vào localStorage order history
      const ordersKey = 'vl_orders_v1';
      const orders = JSON.parse(localStorage.getItem(ordersKey) || '[]');
      orders.push(order);
      localStorage.setItem(ordersKey, JSON.stringify(orders));

      localStorage.removeItem(CART_KEY);
      updateCartCount();
      renderCart();
      hideCheckoutForm();

      alert(`Đặt hàng thành công! Mã đơn hàng: ${order.id} (Tổng ${formatPrice(total)})`);
    }

    // Product modal functions
    function openProductModal(id, name, price, image, description) {
      currentProduct = { id, name, price, image, description };
      document.getElementById('productModalImage').src = image || '';
      document.getElementById('productModalImage').alt = name;
      document.getElementById('productModalTitle').textContent = name;
      document.getElementById('productModalPrice').textContent = formatPrice(price);
      document.getElementById('productModalDescription').textContent = description;
      document.getElementById('productModal').classList.add('active');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.remove('active');
      currentProduct = null;
    }

    function addToCartFromModal() {
      if (currentProduct) {
        addToCart(currentProduct.id, currentProduct.name, currentProduct.price, currentProduct.image);
        closeProductModal();
      }
    }

    // Init cart count
    updateCartCount();
  </script>
</body>
</html>
