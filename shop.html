<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sản phẩm | Vanlam Technologies</title>
  <meta name="description" content="Danh sách sản phẩm của Vanlam Technologies. Khám phá các sản phẩm công nghệ và giải pháp số hóa." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Global Styles -->
  <link rel="stylesheet" href="index.css">
  
  <style>
    .page-header {
      background: var(--primary);
      color: white;
      padding: 80px 0;
      text-align: center;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
      padding: 60px 0;
    }
    .product-card {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .product-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .product-card:hover .product-img {
      transform: scale(1.05);
    }
    .product-info {
      padding: 1.5rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .product-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    
    /* Cart Floating Button */
    .cart-floating {
      position: fixed;
      bottom: 100px;
      right: 24px;
      width: 60px;
      height: 60px;
      background: var(--accent);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.2s;
    }
    .cart-floating:hover { transform: scale(1.1); }
    .cart-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ef4444;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal Modernization */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      color: var(--text);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: var(--radius);
      padding: 2rem;
      position: relative;
    }
  </style>
</head>
<body>

  <!-- Header is injected by ui.js -->

  <main>
    <section class="page-header reveal">
      <div class="container">
        <h1 style="color: white; margin-bottom: 0.5rem;">Cửa hàng công nghệ</h1>
        <p style="color: #94a3b8;">Khám phá các thiết bị và giải pháp chuyển đổi số hiện đại nhất</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div id="productsList" class="products-grid">
          <!-- Dynamically populated by JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- Cart Floating Button -->
  <div class="cart-floating" onclick="openCart()">
    🛒 <span class="cart-badge" id="cartCount">0</span>
  </div>

  <!-- Product Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeProductModal()" style="position:absolute; top:1rem; right:1rem; background:var(--border); border:none; width:32px; height:32px; border-radius:50%; cursor:pointer;">✕</button>
      <img id="productModalImage" src="" alt="" style="width:100%; border-radius:var(--radius); margin-bottom:1.5rem;">
      <h2 id="productModalTitle" style="margin-bottom:0.5rem;"></h2>
      <div id="productModalPrice" class="product-price"></div>
      <p id="productModalDescription" style="margin-bottom:2rem; line-height:1.6; color:var(--muted);"></p>
      <div id="productModalActions" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <!-- Injected by JS -->
      </div>
    </div>
  </div>

  <!-- Footer is injected by ui.js -->

  <script src="auth.js"></script>
  <script src="cart.js"></script>
  <script src="ui.js"></script>

  <script>
    const PRODUCTS_KEY = 'vl_products_v1';

    function loadProducts(){
      try{ return JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]') }catch(e){ return [] }
    }

    function formatPrice(price) {
      if (!price || price === 0) return 'Liên hệ';
      return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
    }

    function renderProducts(){
      const container = document.getElementById('productsList');
      if (!container) return;
      const products = loadProducts();
      
      if(!products.length){
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px 0;">Chưa có sản phẩm nào.</div>';
        return;
      }
      
      container.innerHTML = products.map((p, index) => {
        const delay = (index % 4) * 0.1;
        return `
        <article class="card product-card reveal" style="transition-delay: ${delay}s">
          ${p.image ? `<img src="${p.image}" class="product-img" alt="${p.name}" onclick="handleViewDetails('${p.id}')">` : ''}
          <div class="product-info">
            <h3 style="margin-bottom: 0.5rem; font-size: 1.1rem;">${p.name}</h3>
            <div class="product-price">${formatPrice(p.price)}</div>
            <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 1.5rem; -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;">
              ${p.description}
            </p>
            <div style="margin-top: auto; display: flex; gap: 0.5rem;">
              ${p.price > 0 ? 
                `<button class="btn btn-primary" style="flex:1; font-size:0.8rem; padding:8px;" onclick="handleAddToCart('${p.id}')">Thêm vào giỏ</button>` : 
                `<a href="contact.html" class="btn btn-primary" style="flex:1; font-size:0.8rem; padding:8px;">Liên hệ ngay</a>`
              }
              <button class="btn" style="flex:1; font-size:0.8rem; padding:8px; border:1px solid var(--border);" onclick="handleViewDetails('${p.id}')">Chi tiết</button>
            </div>
          </div>
        </article>
      `;
      }).join('');

      if (window.initScrollReveal) window.initScrollReveal();
    }

    function handleAddToCart(productId) {
      const products = loadProducts();
      const p = products.find(item => item.id === productId);
      if (p && typeof addToCart === 'function') {
        addToCart(p.id, p.name, p.price, p.image, 1);
      }
    }

    function handleViewDetails(productId) {
      const products = loadProducts();
      const p = products.find(item => item.id === productId);
      if (!p) return;

      document.getElementById('productModalImage').src = p.image || '';
      document.getElementById('productModalTitle').textContent = p.name;
      document.getElementById('productModalPrice').textContent = formatPrice(p.price);
      document.getElementById('productModalDescription').textContent = p.description;
      
      const actions = document.getElementById('productModalActions');
      if (p.price > 0) {
        actions.innerHTML = `
          <button class="btn btn-primary" onclick="addToCartFromModal('${p.id}')">Thêm vào giỏ</button>
          <button class="btn" style="border:1px solid var(--border);" onclick="closeProductModal()">Đóng</button>
        `;
      } else {
        actions.innerHTML = `
          <a href="contact.html" class="btn btn-primary" style="text-align:center;">Liên hệ ngay</a>
          <button class="btn" style="border:1px solid var(--border);" onclick="closeProductModal()">Đóng</button>
        `;
      }

      document.getElementById('productModal').classList.add('active');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.remove('active');
    }

    function addToCartFromModal(id) {
      handleAddToCart(id);
      closeProductModal();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderProducts();
      const modal = document.getElementById('productModal');
      modal.addEventListener('click', (e) => { if(e.target === modal) closeProductModal(); });
    });
  </script>
</body>
</html>
