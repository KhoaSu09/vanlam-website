<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tài liệu | Vanlam Technologies</title>
  <meta name="description" content="Thư viện tài liệu Vanlam Technologies. Xem và tải về các tài liệu Word, PDF, Excel, PowerPoint trực tuyến." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Global Styles -->
  <link rel="stylesheet" href="index.css">
  
  <style>
    .page-header {
      background: var(--primary);
      color: white;
      padding: 80px 0;
      text-align: center;
    }
    
    /* Tabs Modernization */
    .tabs-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 40px 0;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      padding: 12px 24px;
      cursor: pointer;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .search-container {
      max-width: 500px;
      margin: 0 auto 40px;
    }
    .search-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-family: inherit;
    }
    
    .lib-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      padding-bottom: 60px;
    }
    
    .doc-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .doc-header {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .doc-icon {
      width: 48px;
      height: 48px;
      background: var(--bg);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    
    /* Upload Card */
    .upload-zone {
      border: 2px dashed var(--border);
      padding: 60px;
      text-align: center;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s;
      max-width: 600px;
      margin: 0 auto 60px;
    }
    .upload-zone:hover { border-color: var(--accent); background: rgba(37, 99, 235, 0.05); }

    /* Viewer */
    .viewer-panel {
      display: none;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 2rem;
      margin: 40px 0;
    }
    .viewer-panel.active { display: block; }
    #documentOutput { 
      padding: 2rem; 
      background: white; 
      color: #333; 
      border-radius: 8px;
      min-height: 400px;
      overflow-x: auto;
    }
    
    /* Loader Overlay */
    .loader-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
    }
    .loader-overlay.active { display: flex; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <p id="loaderText">Đang tải...</p>
  </div>

  <!-- Header is injected by ui.js -->

  <main>
    <section class="page-header reveal">
      <div class="container">
        <h1 style="color: white; margin-bottom: 0.5rem;">Thư viện tài liệu</h1>
        <p style="color: #94a3b8;">Hệ thống lưu trữ và đồng bộ hóa tài liệu kỹ thuật trực tuyến</p>
      </div>
    </section>

    <div class="container">
      <div class="tabs-container reveal">
        <div class="tab-btn active" onclick="switchTab('library')">Thư viện dùng chung</div>
        <div class="tab-btn" onclick="switchTab('local')">Đọc file cá nhân</div>
      </div>

      <!-- Shared Library Tab -->
      <div id="tabLibrary" class="tab-content active">
        <div class="search-container reveal">
          <input type="text" id="libSearch" class="search-input" placeholder="Tìm kiếm tài liệu..." oninput="filterLibrary()">
        </div>
        <div id="libList" class="lib-grid">
          <!-- Dynamically loaded -->
        </div>
      </div>

      <!-- Local Reader Tab -->
      <div id="tabLocal" class="tab-content">
        <div class="upload-zone reveal" onclick="document.getElementById('fileInput').click()">
          <div style="font-size: 3rem; margin-bottom: 1rem;">📂</div>
          <h3>Kéo thả file để đọc ngay</h3>
          <p style="color: var(--muted);">Hỗ trợ PDF, Word (.docx), Excel (.xlsx). File sẽ không được lưu lên hệ thống.</p>
          <input type="file" id="fileInput" style="display:none" accept=".docx,.pdf,.xlsx,.xls" onchange="handleLocalFile(event)" />
        </div>
      </div>

      <!-- Document Viewer Panel -->
      <div id="viewerCard" class="viewer-panel reveal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
          <h2 id="viewTitle" style="font-size: 1.25rem;">Tên tài liệu</h2>
          <button class="btn" onclick="closeViewer()" style="border: 1px solid var(--border);">Đóng viewer</button>
        </div>
        <div id="documentOutput"></div>
      </div>
    </div>
  </main>

  <!-- Footer is injected by ui.js -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="auth.js"></script>
  <script src="ui.js"></script>

  <script>
    const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/KhoaSu09/vanlam-website/main/docs/database.json';
    let sharedDocs = [];

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      const tabBtns = document.querySelectorAll('.tab-btn');
      if(tab === 'library') {
        tabBtns[0].classList.add('active');
        document.getElementById('tabLibrary').classList.add('active');
      } else {
        tabBtns[1].classList.add('active');
        document.getElementById('tabLocal').classList.add('active');
      }
      closeViewer();
    }

    async function loadLibrary() {
      showLoader(true, 'Đang kết nối GitHub...');
      try {
        const res = await fetch(GITHUB_RAW_URL + '?v=' + Date.now());
        if (res.ok) sharedDocs = await res.json();
      } catch (e) { console.error('GitHub Load Error:', e); }
      renderLibrary(sharedDocs);
      showLoader(false);
    }

    function renderLibrary(docs) {
      const list = document.getElementById('libList');
      if (!list) return;

      if (!docs.length) {
        list.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--muted);">Không tìm thấy tài liệu nào.</div>';
        return;
      }

      list.innerHTML = docs.sort((a,b) => new Date(b.date) - new Date(a.date)).map((doc, idx) => `
        <div class="card doc-card reveal" style="transition-delay: ${ (idx % 3) * 0.1 }s">
          <div class="doc-header">
            <div class="doc-icon">${getIcon(doc.ext)}</div>
            <div>
              <div style="font-weight:700; font-size:1rem; line-height:1.3;">${doc.name}</div>
              <div style="font-size:0.75rem; color:var(--muted); margin-top:4px;">
                ${(doc.size / 1024).toFixed(1)} KB • ${new Date(doc.date).toLocaleDateString('vi-VN')}
              </div>
            </div>
          </div>
          <div style="display:flex; gap:0.5rem; margin-top:auto;">
            ${['pdf','docx','xlsx','xls'].includes(doc.ext) ? 
              `<button class="btn btn-primary" style="padding:6px 12px; font-size:0.8rem; flex:1;" onclick="viewGitHubDoc('${doc.id}')">Xem online</button>` : ''}
            <a href="${doc.url}" target="_blank" class="btn" style="padding:6px 12px; font-size:0.8rem; border:1px solid var(--border); flex:1;" download="${doc.name}">Tải về</a>
          </div>
        </div>
      `).join('');
      
      if (window.initScrollReveal) window.initScrollReveal();
    }

    function getIcon(ext) {
      const icons = { pdf: '📕', docx: '📘', doc: '📘', xlsx: '📗', xls: '📗', pptx: '📙' };
      return icons[ext] || '📄';
    }

    function filterLibrary() {
      const q = document.getElementById('libSearch').value.toLowerCase();
      renderLibrary(sharedDocs.filter(d => d.name.toLowerCase().includes(q)));
    }

    async function viewGitHubDoc(id) {
      const doc = sharedDocs.find(d => d.id === id);
      if(!doc) return;
      showLoader(true, 'Đang tải file từ GitHub...');
      try {
        const res = await fetch(doc.url);
        const blob = await res.blob();
        handleFileProcessing(blob, doc.name, doc.ext);
      } catch(e) {
        alert('Lỗi khi tải file.');
        showLoader(false);
      }
    }

    function handleLocalFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const ext = file.name.split('.').pop().toLowerCase();
      handleFileProcessing(file, file.name, ext);
    }

    function handleFileProcessing(fileOrBlob, name, ext) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const buffer = e.target.result;
        processData(buffer, name, ext);
      };
      reader.readAsArrayBuffer(fileOrBlob);
    }

    function processData(buffer, name, ext) {
      showLoader(true, 'Đang phân giải dữ liệu...');
      document.getElementById('viewTitle').textContent = name;
      const output = document.getElementById('documentOutput');

      try {
        if (ext === 'pdf') {
          const blob = new Blob([buffer], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);
          output.innerHTML = `<iframe src="${url}" width="100%" height="800px" style="border:none; border-radius:8px;"></iframe>`;
          finishView();
        } else if (ext === 'docx') {
          mammoth.convertToHtml({ arrayBuffer: buffer }).then(res => { 
            output.innerHTML = res.value; 
            finishView(); 
          });
        } else if (ext === 'xlsx' || ext === 'xls') {
          const workbook = XLSX.read(buffer, { type: 'array' });
          const html = XLSX.utils.sheet_to_html(workbook.Sheets[workbook.SheetNames[0]]);
          output.innerHTML = `<div style="overflow:auto;">${html}</div>`;
          finishView();
        } else {
          alert('Định dạng file không hỗ trợ xem online.');
          showLoader(false);
        }
      } catch (e) {
        alert('Có lỗi xảy ra khi đọc file.');
        showLoader(false);
      }
    }

    function finishView() {
      document.getElementById('viewerCard').classList.add('active');
      document.getElementById('tabLibrary').classList.remove('active');
      document.getElementById('tabLocal').classList.remove('active');
      showLoader(false);
      window.scrollTo({ top: document.getElementById('viewerCard').offsetTop - 100, behavior: 'smooth' });
    }

    function closeViewer() {
      document.getElementById('viewerCard').classList.remove('active');
      const activeTab = document.querySelector('.tab-btn.active').textContent.includes('Thư viện') ? 'tabLibrary' : 'tabLocal';
      document.getElementById(activeTab).classList.add('active');
      document.getElementById('documentOutput').innerHTML = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showLoader(s, text = 'Đang tải...') { 
      const loader = document.getElementById('loader');
      document.getElementById('loaderText').textContent = text;
      loader.classList.toggle('active', s); 
    }

    document.addEventListener('DOMContentLoaded', loadLibrary);
  </script>
</body>
</html>
