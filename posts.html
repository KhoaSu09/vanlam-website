<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quản lý bài viết | Vanlam Consulting</title>
  <style>
    body { font-family: Inter, system-ui, Arial; margin:0; color:#111; background:#f8fafc }
    .container { max-width:900px; margin:32px auto; padding:0 20px }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px }
    a { color:#0f3c7d; text-decoration:none }
    .btn { padding:8px 14px; background:#0f3c7d; color:#fff; border:none; border-radius:6px; cursor:pointer }
    .btn:hover { background:#0a2847 }
    .btn-danger { background:#dc2626 }
    .btn-danger:hover { background:#b91c1c }

    /* Login Form */
    .login-container { max-width:400px; margin:60px auto; background:#fff; padding:30px; border-radius:8px; box-shadow:0 6px 20px rgba(2,6,23,.06) }
    .login-container h2 { margin-bottom:20px; text-align:center }
    .login-container input { width:100%; padding:10px; margin-bottom:12px; border:1px solid #e5e7eb; border-radius:6px }
    .login-container button { width:100% }
    .error { color:#dc2626; font-size:14px; margin-bottom:12px }

    /* Admin Panel */
    .admin-panel { display:none }
    .admin-panel.active { display:block }
    .admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px }

    /* Post Form */
    .post-form { background:#fff; padding:20px; border-radius:8px; box-shadow:0 6px 20px rgba(2,6,23,.06); margin-bottom:24px }
    .form-group { margin-bottom:12px }
    .form-group label { display:block; margin-bottom:6px; font-weight:500 }
    input[type="text"], textarea { width:100%; padding:10px; border:1px solid #e5e7eb; border-radius:6px; font-family:inherit }
    textarea { resize:vertical }
    .form-group button { margin-top:10px }

    /* Posts List */
    .posts-list { margin-top:24px }
    .post-item { background:#fff; padding:16px; border-radius:8px; margin-bottom:12px; box-shadow:0 4px 14px rgba(2,6,23,.04) }
    .post-item h3 { margin-bottom:8px; margin-top:0 }
    .post-meta { color:#6b7280; font-size:13px; margin-bottom:10px }
    .post-content { white-space:pre-wrap; margin-bottom:10px }
    .post-actions { display:flex; gap:8px }
    .empty-state { color:#6b7280; text-align:center; padding:40px 0 }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Form -->
    <div id="loginForm" class="login-container">
      <h2>Đăng nhập Admin</h2>
      <div id="loginError" class="error"></div>
      <input type="password" id="adminPassword" placeholder="Nhập mật khẩu admin" />
      <button class="btn" onclick="adminLogin()">Đăng nhập</button>
      <p style="text-align:center; color:#6b7280; font-size:14px; margin-top:20px">
        <a href="index.html">← Quay về trang chủ</a>
      </p>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-panel">
      <div class="admin-header">
        <h1>Quản lý bài viết</h1>
        <button class="btn btn-danger" onclick="adminLogout()">Đăng xuất</button>
      </div>

      <!-- Post Form -->
      <div class="post-form">
        <div class="form-group">
          <label for="title">Tiêu đề</label>
          <input type="text" id="title" placeholder="Tiêu đề bài viết" />
        </div>
        <div class="form-group">
          <label for="content">Nội dung</label>
          <textarea id="content" rows="6" placeholder="Viết nội dung ở đây..."></textarea>
        </div>
        <div class="form-group">
          <button class="btn" onclick="publishPost()">Đăng bài</button>
        </div>
      </div>

      <!-- Posts List -->
      <h2>Bài viết đã đăng</h2>
      <div id="postsList" class="posts-list"></div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = 'admin123';
    const POSTS_KEY = 'vl_posts_v1';
    const AUTH_KEY = 'vl_admin_auth';

    function checkAuth(){
      return localStorage.getItem(AUTH_KEY) === 'true';
    }

    function adminLogin(){
      const pwd = document.getElementById('adminPassword').value;
      const errorEl = document.getElementById('loginError');
      
      if(!pwd){
        errorEl.textContent = 'Vui lòng nhập mật khẩu';
        return;
      }
      
      if(pwd === ADMIN_PASSWORD){
        localStorage.setItem(AUTH_KEY, 'true');
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('adminPanel').classList.add('active');
        renderPosts();
      } else {
        errorEl.textContent = 'Mật khẩu không chính xác';
        document.getElementById('adminPassword').value = '';
      }
    }

    function adminLogout(){
      localStorage.removeItem(AUTH_KEY);
      document.getElementById('adminPanel').classList.remove('active');
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('adminPassword').value = '';
      document.getElementById('loginError').textContent = '';
    }

    function loadPosts(){
      try{ return JSON.parse(localStorage.getItem(POSTS_KEY) || '[]') }catch(e){ return [] }
    }

    function savePosts(posts){ localStorage.setItem(POSTS_KEY, JSON.stringify(posts)) }

    function publishPost(){
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      
      if(!title || !content){
        alert('Vui lòng nhập tiêu đề và nội dung');
        return;
      }
      
      const posts = loadPosts();
      const post = {
        id: Date.now(),
        title,
        content,
        date: new Date().toISOString()
      };
      
      posts.unshift(post);
      savePosts(posts);
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      renderPosts();
    }

    function deletePost(id){
      if(!confirm('Bạn chắc chắn muốn xóa bài này?')) return;
      let posts = loadPosts();
      posts = posts.filter(p => p.id !== id);
      savePosts(posts);
      renderPosts();
    }

    function renderPosts(){
      const container = document.getElementById('postsList');
      const posts = loadPosts();
      
      if(!posts.length){
        container.innerHTML = '<div class="empty-state">Chưa có bài viết nào</div>';
        return;
      }
      
      container.innerHTML = posts.map(p => `
        <div class="post-item">
          <h3>${escapeHtml(p.title)}</h3>
          <div class="post-meta">${new Date(p.date).toLocaleString('vi-VN')}</div>
          <div class="post-content">${escapeHtml(p.content)}</div>
          <div class="post-actions">
            <button class="btn btn-danger" onclick="deletePost(${p.id})">Xóa</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(s){
      return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // On page load
    if(checkAuth()){
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('adminPanel').classList.add('active');
      renderPosts();
    }
  </script>
</body>
</html>
