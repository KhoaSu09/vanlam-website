<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quản lý bài viết | Vanlam technologies</title>
  <meta name="description" content="Quản lý bài viết của Vanlam technologies. Thêm, chỉnh sửa và xóa nội dung tin tức, kèm hình ảnh." />
  <meta name="keywords" content="quản lý bài viết, tin tức, Vanlam technologies, đăng bài" />
  <meta property="og:title" content="Quản lý bài viết | Vanlam technologies" />
  <meta property="og:description" content="Trang quản lý bài viết cho tin tức của Vanlam technologies. Thêm bài, sửa bài, xóa bài và cập nhật nội dung nhanh chóng." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://example.com/og-image.png" />
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --text:#111; --muted:#6b7280; --primary:#0f3c7d; --danger:#c92a2a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, system-ui, Arial; background:var(--bg); color:var(--text); }
    .page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; }

    .card { width:100%; max-width:520px; background:var(--card); border-radius:18px; padding:32px; box-shadow:0 18px 50px rgba(2,6,23,.08); }
    h1 { margin:0 0 16px; font-size:28px; text-align:center; }
    .hint { margin:0 0 24px; text-align:center; color:#c92a2a; font-weight:600; }

    .form-group { margin-bottom:18px; }
    .form-label { display:block; font-size:14px; margin-bottom:8px; color:var(--muted); }
    .form-control { width:100%; padding:12px 14px; border:1px solid #d2d6dc; border-radius:12px; font-size:15px; }
    .form-control:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(15,60,125,.12); }

    button { width:100%; padding:12px 14px; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-primary:hover { filter:brightness(1.06); }
    .btn-secondary { background:#e5e7eb; color:#111; }

    .footer { margin-top:24px; text-align:center; font-size:13px; color:var(--muted); }

    .hidden { display:none !important; }

    /* Management UI */
    .manager { display:flex; flex-direction:column; gap:16px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    .toolbar .btn { width:auto; }

    .posts-list { display:grid; gap:12px; }
    .post-item { border:1px solid #e5e7eb; border-radius:12px; padding:14px 16px; background:#fff; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .post-meta { font-size:13px; color:var(--muted); margin-top:4px; }

    .post-actions { display:flex; gap:8px; }
    .btn-danger { background:var(--danger); color:#fff; }
    .btn-danger:hover { filter:brightness(1.08); }

    .modal { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.45); padding:16px; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease; }
    .modal.active { opacity:1; pointer-events:auto; }
    .modal-content { width:100%; max-width:520px; background:var(--card); border-radius:18px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.2); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .modal-title { margin:0; font-size:20px; }
    .modal-close { background:none; border:none; font-size:24px; cursor:pointer; color:var(--muted); }
    .modal-close:hover { color:var(--text); }
  </style>
</head>
<body>
  <div class="page">
    <div class="card" id="loginCard">
      <h1>Đăng nhập Admin</h1>
      <div id="loginHint" class="hint hidden"></div>
      <div class="form-group">
        <label class="form-label" for="passwordInput">Vui lòng nhập mật khẩu</label>
        <input id="passwordInput" class="form-control" type="password" placeholder="Nhập mật khẩu admin" autocomplete="current-password" />
      </div>
      <button id="loginBtn" class="btn btn-primary">Đăng nhập</button>
      <div class="footer">
        <a href="index.html">← Quay về trang chủ</a>
      </div>
    </div>

    <div class="card hidden" id="managerCard">
      <div class="manager">
        <div class="toolbar">
          <div>
            <h1 style="margin:0; font-size:22px;">Quản lý bài viết</h1>
            <div id="managerInfo" class="post-meta">Tải bài viết...</div>
          </div>
          <div class="post-actions">
            <button id="addPostBtn" class="btn btn-primary">Thêm bài mới</button>
            <button id="logoutBtn" class="btn btn-secondary">Đăng xuất</button>
          </div>
        </div>

        <div id="postsList" class="posts-list"></div>
      </div>
    </div>
  </div>

  <div id="postModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Thêm / Sửa bài viết</h2>
        <button class="modal-close" aria-label="Đóng" onclick="closeModal()">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label" for="postTitle">Tiêu đề</label>
        <input id="postTitle" class="form-control" type="text" placeholder="Nhập tiêu đề" />
      </div>
      <div class="form-group">
        <label class="form-label" for="postContent">Nội dung</label>
        <textarea id="postContent" class="form-control" rows="7" placeholder="Nhập nội dung"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="postImage">Hình ảnh (tùy chọn)</label>
        <input id="postImage" class="form-control" type="file" accept="image/*" />
        <div id="imagePreview" style="margin-top:8px;"></div>
      </div>
      <button id="savePostBtn" class="btn btn-primary">Lưu</button>
    </div>
  </div>

  <footer style="position:fixed; bottom:12px; left:0; right:0; text-align:center; font-size:12px; color:var(--muted);">
    © 2025 Vanlam technologies. All rights reserved.
  </footer>

  <script>
    const POSTS_KEY = 'vl_posts_v1';
    const ADMIN_PASSWORD = 'admin123'; // Thay đổi mật khẩu ở đây

    const loginCard = document.getElementById('loginCard');
    const managerCard = document.getElementById('managerCard');
    const loginHint = document.getElementById('loginHint');

    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');

    const addPostBtn = document.getElementById('addPostBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const postsList = document.getElementById('postsList');
    const managerInfo = document.getElementById('managerInfo');

    const postModal = document.getElementById('postModal');
    const modalTitle = document.getElementById('modalTitle');
    const postTitle = document.getElementById('postTitle');
    const postContent = document.getElementById('postContent');
    const postImage = document.getElementById('postImage');
    const savePostBtn = document.getElementById('savePostBtn');

    let editingId = null;

    function loadPosts() {
      try { return JSON.parse(localStorage.getItem(POSTS_KEY) || '[]'); }
      catch (e) { return []; }
    }

    function savePosts(posts) {
      localStorage.setItem(POSTS_KEY, JSON.stringify(posts));
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleString('vi-VN', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderPosts() {
      const posts = loadPosts().sort((a,b) => new Date(b.date) - new Date(a.date));
      managerInfo.textContent = `${posts.length} bài viết`; 
      if (!posts.length) {
        postsList.innerHTML = '<div style="padding:18px; border:1px dashed #cbd5e1; border-radius:12px; text-align:center; color:#6b7280;">Chưa có bài viết nào.</div>';
        updateSeoJsonLd([]);
        return;
      }

      postsList.innerHTML = posts.map(p => {
        const preview = p.content.length > 100 ? p.content.substring(0, 100) + '…' : p.content;
        const imageHtml = p.image ? `<img src="${p.image}" style="max-width:100%; height:auto; margin-bottom:8px; border-radius:8px;" loading="lazy" />` : '';
        return `
          <div class="post-item" data-id="${p.id}">
            <div style="flex:1;">
              <strong>${escapeHtml(p.title)}</strong>
              <div class="post-meta">${formatDate(p.date)}</div>
              ${imageHtml}
              <div style="margin-top:8px; color:#4b5563; font-size:14px; white-space:pre-wrap;">${escapeHtml(preview)}</div>
            </div>
            <div class="post-actions">
              <button class="btn btn-secondary" onclick="openEdit('${p.id}')">Sửa</button>
              <button class="btn btn-danger" onclick="deletePost('${p.id}')">Xóa</button>
            </div>
          </div>
        `;
      }).join('');

      updateSeoJsonLd(posts);
    }

    function updateSeoJsonLd(posts) {
      const schema = {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "Vanlam technologies - Quản lý bài viết",
        "url": window.location.href,
        "description": "Trang quản lý bài viết / tin tức của Vanlam technologies.",
        "blogPost": posts.map(p => {
          const item = {
            "@type": "NewsArticle",
            "headline": p.title,
            "datePublished": p.date,
            "dateModified": p.date,
            "description": p.content ? p.content.substring(0, 160) : '',
            "articleBody": p.content,
            "url": `${window.location.origin}${window.location.pathname}#${p.id}`,
            "publisher": {
              "@type": "Organization",
              "name": "Vanlam technologies",
              "logo": {
                "@type": "ImageObject",
                "url": "https://example.com/logo.png"
              }
            }
          };
          if (p.image) item.image = p.image;
          return item;
        })
      };

      let schemaEl = document.getElementById('ldJson');
      if (!schemaEl) {
        schemaEl = document.createElement('script');
        schemaEl.id = 'ldJson';
        schemaEl.type = 'application/ld+json';
        document.head.appendChild(schemaEl);
      }
      schemaEl.textContent = JSON.stringify(schema, null, 2);
    }

    function escapeHtml(s) {
      return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function showManager() {
      loginCard.classList.add('hidden');
      managerCard.classList.remove('hidden');
      renderPosts();
    }

    function showLogin(message) {
      managerCard.classList.add('hidden');
      loginCard.classList.remove('hidden');
      if (message) {
        loginHint.textContent = message;
        loginHint.classList.remove('hidden');
      } else {
        loginHint.classList.add('hidden');
      }
      passwordInput.value = '';
      passwordInput.focus();
    }

    function checkAuth() {
      return sessionStorage.getItem('vl_admin_authed') === '1';
    }

    function setAuth(value) {
      if (value) sessionStorage.setItem('vl_admin_authed', '1');
      else sessionStorage.removeItem('vl_admin_authed');
    }

    function openModal(post = null) {
      postModal.classList.add('active');
      if (post) {
        editingId = post.id;
        modalTitle.textContent = 'Sửa bài viết';
        postTitle.value = post.title;
        postContent.value = post.content;
        document.getElementById('imagePreview').innerHTML = post.image ? `<img src="${post.image}" style="max-width:100%; height:auto; border-radius:8px;" loading="lazy" />` : '';
      } else {
        editingId = null;
        modalTitle.textContent = 'Thêm bài viết';
        postTitle.value = '';
        postContent.value = '';
        document.getElementById('imagePreview').innerHTML = '';
      }
      postImage.value = '';
      postTitle.focus();
    }

    function closeModal() {
      postModal.classList.remove('active');
    }

    async function savePost() {
      const title = postTitle.value.trim();
      const content = postContent.value.trim();
      const date = new Date().toISOString();

      if (!title || !content) {
        alert('Vui lòng điền đầy đủ tiêu đề và nội dung.');
        return;
      }

      let image = null;
      if (postImage.files[0]) {
        image = await readFileAsDataURL(postImage.files[0]);
      }

      const posts = loadPosts();
      if (editingId) {
        const idx = posts.findIndex(p => p.id === editingId);
        if (idx !== -1) {
          posts[idx] = { ...posts[idx], title, content, date, image: image || posts[idx].image };
        }
      } else {
        posts.push({ id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(), title, content, date, image });
      }

      savePosts(posts);
      closeModal();
      renderPosts();
    }

    function openEdit(id) {
      const posts = loadPosts();
      const post = posts.find(p => p.id === id);
      if (!post) return;
      openModal(post);
    }

    function deletePost(id) {
      if (!confirm('Xóa bài viết này?')) return;
      const posts = loadPosts().filter(p => p.id !== id);
      savePosts(posts);
      renderPosts();
    }

    loginBtn.addEventListener('click', () => {
      const value = passwordInput.value.trim();
      if (value === ADMIN_PASSWORD) {
        setAuth(true);
        showManager();
      } else {
        showLogin('Mật khẩu không đúng, vui lòng thử lại.');
      }
    });

    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    addPostBtn.addEventListener('click', () => openModal());
    logoutBtn.addEventListener('click', () => {
      setAuth(false);
      showLogin();
    });

    savePostBtn.addEventListener('click', async () => {
      await savePost();
    });

    postModal.addEventListener('click', (e) => {
      if (e.target === postModal) closeModal();
    });

    // Init
    if (checkAuth()) showManager();
    else showLogin();
  </script>
</body>
</html>
