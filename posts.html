<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bài viết | Vanlam Consulting</title>
  <style>
    body { font-family: Inter, system-ui, Arial; margin:0; color:#111; background:#f8fafc }
    .container { max-width:900px; margin:32px auto; padding:0 20px }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px }
    a { color:#0f3c7d; text-decoration:none }
    .post-form { background:#fff; padding:16px; border-radius:8px; box-shadow:0 6px 20px rgba(2,6,23,.06) }
    input, textarea { width:100%; padding:10px; margin-top:8px; border:1px solid #e5e7eb; border-radius:6px }
    button { margin-top:10px; padding:10px 14px; background:#0f3c7d; color:#fff; border:none; border-radius:6px }
    .posts { margin-top:20px; }
    .post { background:#fff; padding:16px; border-radius:8px; margin-bottom:12px; box-shadow:0 4px 14px rgba(2,6,23,.04) }
    .post h3 { margin-bottom:8px }
    .meta { color:#6b7280; font-size:13px }
    .empty { color:#6b7280; text-align:center; padding:40px 0 }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Bài viết</h1>
      <nav>
        <a href="index.html">Trang chủ</a>
      </nav>
    </header>

    <section class="post-form">
      <label for="title">Tiêu đề</label>
      <input id="title" placeholder="Tiêu đề bài viết" />
      <label for="content">Nội dung</label>
      <textarea id="content" rows="6" placeholder="Viết nội dung ở đây..."></textarea>
      <button id="saveBtn">Đăng bài (lưu vào trình duyệt)</button>
    </section>

    <section class="posts" id="posts"></section>
  </div>

  <script>
    const postsKey = 'vl_posts_v1'

    function loadPosts(){
      try{ return JSON.parse(localStorage.getItem(postsKey) || '[]') }catch(e){ return [] }
    }

    function savePosts(posts){ localStorage.setItem(postsKey, JSON.stringify(posts)) }

    function render(){
      const container = document.getElementById('posts')
      const posts = loadPosts()
      if(!posts.length){ container.innerHTML = '<div class="empty">Chưa có bài viết nào. Viết bài và nhấn "Đăng bài" để lưu.</div>'; return }
      container.innerHTML = posts.map(p=>`<article class="post"><h3>${escapeHtml(p.title)}</h3><div class="meta">${new Date(p.date).toLocaleString()}</div><div style="margin-top:10px;white-space:pre-wrap">${escapeHtml(p.content)}</div></article>`).join('')
    }

    function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

    document.getElementById('saveBtn').addEventListener('click', ()=>{
      const title = document.getElementById('title').value.trim()
      const content = document.getElementById('content').value.trim()
      if(!title || !content){ alert('Vui lòng nhập tiêu đề và nội dung'); return }
      const posts = loadPosts()
      posts.unshift({ title, content, date: new Date().toISOString() })
      savePosts(posts)
      document.getElementById('title').value = ''
      document.getElementById('content').value = ''
      render()
    })

    render()
  </script>
</body>
</html>
